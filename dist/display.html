<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>창 안과 밖 · 디스플레이</title>
<script>if(new URLSearchParams(location.search).get('exhibition')==='1')document.documentElement.classList.add('exhibition-output');</script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font:12px -apple-system,BlinkMacSystemFont,sans-serif}body{display:grid;place-items:safe center;overflow:auto}body.fullscreen{overflow:hidden}canvas{display:block;image-rendering:pixelated;cursor:default}#controls{position:fixed;top:12px;left:12px;right:12px;max-width:430px;background:#273127ee;border:1px solid #64715d;border-radius:8px;padding:15px;line-height:1.8;transition:opacity .2s}h1{font-size:14px;margin:0 0 7px}p{margin:7px 0;color:#cad0c3}button,a{font:inherit;color:#fff;background:#516149;border:0;border-radius:4px;padding:8px 10px;text-decoration:none;cursor:default}button:focus-visible,a:focus-visible{outline:2px solid #f6c589}button+button{margin-left:4px}.hidden{opacity:0;pointer-events:none}body.quiet,body.quiet canvas{cursor:none}#error{position:absolute;inset:0;background:#202620;display:grid;place-content:center;padding:30px;line-height:1.9}#error[hidden]{display:none}#alignment{accent-color:#d38d58}
body.exhibition{touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none}body.exhibition #controls,body.exhibition #error a{display:none}#exit-menu{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#0008;cursor:default}#exit-menu[hidden]{display:none}#exit-game{font-size:20px;padding:18px 32px;background:#333;color:#fff;cursor:pointer}body.exhibition #screen{pointer-events:none}
/* Cover the root, blank margins, text and overlays, including before display.js loads. */
html.exhibition-output,html.exhibition-output *{cursor:none!important}
html.exhibition-output #controls,html.exhibition-output #error{display:none!important}
html.exhibition-output.operator-exit-open #exit-menu,html.exhibition-output.operator-exit-open #exit-menu *{cursor:default!important}
html.exhibition-output.operator-exit-open #exit-game{cursor:pointer!important}
</style></head><body>
<canvas id="screen" aria-label="게임 화면"></canvas>
<div id="exit-menu" hidden role="dialog" aria-label="전시 종료"><button id="exit-game">게임 종료</button></div>
<div id="controls"><h1 id="title"></h1><p>이 창을 해당 디스플레이로 옮기고 전체화면을 누르세요. 장면은 조정 창의 버튼으로 선택합니다. F로 전체화면, H로 메뉴 표시.</p><button id="fullscreen">전체화면</button><button id="hide">메뉴 숨기기</button><p><label><input type="checkbox" id="alignment"> 화면 테두리 확인</label></p><p id="size"></p><p><a id="phone-link" hidden target="_blank"></a></p></div>
<div id="error" hidden><h1>조정 창과 연결이 끊어졌습니다.</h1><p>조정 창에서 A·B 화면을 다시 열어 주세요.<br>같은 브라우저의 창을 사용해야 합니다.</p><a href="installation.html" target="_blank">조정 창 열기</a></div>
